title = "Prisma Engine gitleaks config"

# Inherit gitleaks' built-in ruleset, then layer our allowlist on top.
[extend]
useDefault = true

[allowlist]
description = "Committed-by-design placeholders are not real secrets"
# .env.example ships intentionally and only holds placeholder values
# (e.g. DATABASE_PASSWORD=prisma_engine, SHARE_AUTH_PASSWORD=change-me-min-16-chars).
# The real .env is gitignored.
paths = [
  '''(^|/)\.env\.example$''',
]
# Ignore the known documentation/example placeholder tokens wherever they appear
# (e.g. .env.example values and the `echo ... >> .env` examples in README.md).
regexes = [
  '''prisma_engine''',
  '''change-me-min-16-chars''',
  '''at-least-16-chars-long''',
  # `bin/rails g devise:install` ships a commented-out
  # `# config.secret_key = '<128-char hex>'` in config/initializers/devise.rb
  # as documentation of how to override Devise's default token derivation
  # (it reads from Rails.application.secret_key_base by default). The hex
  # trips the generic-api-key rule on every fresh install. We delete it
  # before committing, but pin the false positive in case a future
  # devise:install regenerates the file and the line slips through review.
  '''# config\.secret_key = [']?[0-9a-f]{128}[']?''',
]
