test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 (S3-compatible), public bucket served via a Cloudflare custom domain.
# Production-only; dev + test stay on Disk. Credentials/config come from the env
# (see .env.example). The custom ActiveStorage::Service::R2Service rewrites public
# URLs to R2_PUBLIC_HOST and drops the public-read ACL R2 doesn't use.
# force_path_style + when_required checksums keep aws-sdk-s3 compatible with R2.
r2:
  service: R2
  public: true
  public_host: <%= ENV["R2_PUBLIC_HOST"] %>
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  region: auto
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
  upload:
    cache_control: "public, max-age=31536000, immutable"
