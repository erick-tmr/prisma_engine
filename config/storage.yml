test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 (S3-compatible), public bucket served via the configured public host.
# Used in development + production (the buckets differ); test stays on Disk. Bucket,
# endpoint, and public host are committed (config/environments/*.rb); only the API
# token lives in credentials. The custom ActiveStorage::Service::R2Service rewrites
# public URLs to that host and drops the public-read ACL R2 doesn't use.
# force_path_style + when_required checksums keep aws-sdk-s3 compatible with R2.
r2:
  service: R2
  public: true
  public_host: <%= Rails.application.config.x.r2_public_host %>
  access_key_id: <%= Rails.application.credentials.dig(:r2, :access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:r2, :secret_access_key) %>
  endpoint: https://ebd6066b8c5c56f2942edd6b4267b706.r2.cloudflarestorage.com
  bucket: <%= Rails.application.config.x.r2_bucket %>
  region: auto
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
  upload:
    cache_control: "public, max-age=31536000, immutable"
