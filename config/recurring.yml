production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  sync_pending_shipments:
    class: SyncPendingShipmentsJob
    schedule: every hour
  recover_stuck_label_requests:
    class: Shipping::RecoverStuckLabelRequestsJob
    schedule: every hour at minute 30
  cancel_expired_orders:
    class: CancelExpiredOrdersJob
    schedule: every hour
  purge_payment_webhook_events:
    class: PurgePaymentWebhookEventsJob
    schedule: "0 3 1 * *"
  unpublish_ended_game_of_the_month:
    class: UnpublishEndedGameOfTheMonthJob
    schedule: "0 0 1 * *"
  refresh_recommendations:
    class: RefreshRecommendationsJob
    schedule: every day at 4am
  sync_meta_catalog:
    class: SyncStaleProductsJob
    schedule: every day at 3am

development:
  sync_pending_shipments:
    class: SyncPendingShipmentsJob
    schedule: every hour
  recover_stuck_label_requests:
    class: Shipping::RecoverStuckLabelRequestsJob
    schedule: every hour at minute 30
  refresh_recommendations:
    class: RefreshRecommendationsJob
    schedule: every day at 4am
