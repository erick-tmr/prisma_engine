# Single São Paulo VPS: Rails app + host-installed Postgres. Runbook: docs/deployment.md.
# Secrets resolve from .kamal/secrets (Bitwarden).
service: prisma_engine

image: erick-tmr/prisma_engine

servers:
  web:
    hosts:
      - 187.127.38.87
    options:
      add-host: host.docker.internal:host-gateway

# TLS: Cloudflare Origin CA cert served by kamal-proxy; edge SSL mode is Full (Strict).
# cert/key come from Bitwarden via .kamal/secrets. Rationale: docs/cloudflare-launch.md.
proxy:
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT
    private_key_pem: CLOUDFLARE_ORIGIN_KEY
  hosts:
    - prismagames.com.br
    - www.prismagames.com.br
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: erick-tmr
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    TZ: America/Sao_Paulo
    PORT: 3000
    WEB_CONCURRENCY: 1
    RAILS_MAX_THREADS: 3
    SOLID_QUEUE_IN_PUMA: 1
    RAILS_LOG_LEVEL: info
    DATABASE_HOST: host.docker.internal
    DATABASE_USER: prisma_engine
    APP_HOST: prismagames.com.br
    ACTIVE_STORAGE_SERVICE: r2
  secret:
    - RAILS_MASTER_KEY
    - PRISMA_ENGINE_DATABASE_PASSWORD
    - DATABASE_PASSWORD
    # Brevo SMTP and the Correios tokens are not env secrets: they live in
    # production.yml.enc (brevo.smtp_login / brevo.smtp_key, correios.api_token /
    # correios.cartao_api_token), decrypted at boot by RAILS_MASTER_KEY.

# Durable logs: Rails writes lograge JSON to log/production.log on this named
# volume, which lives on the VPS disk and survives container replacement, so a
# deploy no longer discards the request history. deploy/fetch-production-logs.sh
# reads it from the volume mountpoint. Runbook: docs/log-analysis.md.
volumes:
  - "prisma_engine_logs:/rails/log"

# Docker json-file rotation for the app container's STDOUT: a bounded live-tail
# buffer for `kamal app logs` (~250 MB, 5 x 50 MB), matching the log/production.log
# rotation. The durable copy is the named volume above; this is short-term only.
# Applies on the next deploy.
logging:
  driver: json-file
  options:
    max-size: 50m
    max-file: 5

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  dbconsole: app exec --interactive --reuse "bin/rails dbconsole"
  logs: app logs --follow
