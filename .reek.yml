# Reek configuration — keeps the signal high on a small Rails app.
# Reek runs advisory-only in CI (the `code_quality` job in
# .github/workflows/ci.yml), on changed files. These overrides silence
# Rails-idiomatic patterns that aren't real smells; the value is catching
# genuine god-objects / over-long methods in new code.
detectors:
  IrresponsibleModule:
    enabled: false        # don't demand a descriptive comment on every class/module
  TooManyStatements:
    max_statements: 8     # controller actions run a few lines; reek's default is 5
  TooManyInstanceVariables:
    max_instance_variables: 7   # a value object (e.g. Cart::Line: id/product/quantity/
                                # options + the made-to-order game/notes) carries a handful
                                # of cohesive fields; 8+ is where a god object lives.
    exclude:
      - PagesController   # the storefront landing action assembles cohesive page state
                          # (hero banner, the product rows, game of the month) — a
                          # view-model for one template, not a god object.
  TooManyMethods:
    exclude:
      - Order             # the made-to-order aggregate root: its API is the lifecycle
                          # transition set (cancel!/request_refund!/confirm_payment!/…)
                          # plus small read-model accessors the storefront renders.
                          # Each method is single-purpose — a rich domain, not a god object.
      - Admin::ProductFormPresenter # a view-model: one small serializer per section of the
                                    # editor graph (options/tags/photos/gotm/brindes) plus
                                    # select/default accessors — cohesive, not a god object.
      - Catalog::SaveProduct        # a command object: one small sync_* method per collection
                                    # it persists (options/tags/photos/gotm/brindes), each
                                    # single-purpose — a cohesive transaction, not a god object.
  LongParameterList:
    max_params: 7         # a cohesive value object / command legitimately takes a
                          # handful of keyword args (a hydrated cart line's fields);
                          # 8+ is where a parameter object is warranted.
  TooManyConstants:
    exclude:
      - Admin::OrderPresenter   # a view-model: small display lookup tables (status flow,
                                # branch anchors, service/payment label + icon maps) are
                                # cohesive presentation config, not a god object.
      - Shipping                # the shipping config namespace: services, package
                                # dimensions, origin/card, and the pré-postagem poll
                                # cadence are cohesive configuration, not a god object.
      - Order                   # the made-to-order aggregate root: its constants are
                                # cohesive domain config (status set, transition graph,
                                # cancellable/mergeable subsets, number/expiry/observation
                                # limits), not a god object — same rationale as the
                                # TooManyMethods exclusion already granted to Order.
  DuplicateMethodCall:
    enabled: false        # noisy on view/controller idioms
  DataClump:
    exclude:
      - EmailResendCooldown # (flow, email) is a cache-key tuple threaded through the key
                            # builder + reader + writer; centralizing normalization in one
                            # key builder (not a value object) is the point, not a smell.
  UtilityFunction:
    enabled: false        # ActiveJob#perform and stateless private helpers (mappers,
                          # connection builders) are normal in jobs/service objects
  FeatureEnvy:
    enabled: false        # attribute mappers and the Faraday request-builder DSL
                          # (`do |req| req.headers ... end`) legitimately lean on a param
  NilCheck:
    enabled: false        # `return if x.nil?` guard clauses are idiomatic Ruby
  MissingSafeMethod:
    enabled: false        # our bang methods wrap ActiveRecord's update!/save! (raise on
                          # failure); there's no non-raising twin to provide
  InstanceVariableAssumption:
    enabled: false        # Rails action methods (`def show; @category = ...`) are the
                          # framework's mechanism for passing state to the template;
                          # reek's "assumes too much" lint is structurally wrong for
                          # every controller action.

exclude_paths:
  - bin
  - config
  - db
  - tmp
  - vendor
