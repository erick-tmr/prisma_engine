---
- name: Set the system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Check whether the swap file exists
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: base_os_swap_stat

- name: Allocate the swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size }} {{ swap_file }}"
    creates: "{{ swap_file }}"
  when: manage_swap | bool

- name: Secure the swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"
  when: manage_swap | bool

- name: Format the swap file
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file }}"
  when:
    - manage_swap | bool
    - not base_os_swap_stat.stat.exists
  changed_when: true

- name: Persist the swap entry in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap_file }} none swap sw 0 0"
    regexp: "^{{ swap_file | regex_escape }}\\s"
    state: present
  when: manage_swap | bool

- name: Activate the swap file
  ansible.builtin.command:
    cmd: "swapon {{ swap_file }}"
  when:
    - manage_swap | bool
    - not base_os_swap_stat.stat.exists
  register: base_os_swapon_result
  changed_when: base_os_swapon_result.rc == 0
  failed_when:
    - base_os_swapon_result.rc != 0
    - "'already active' not in base_os_swapon_result.stderr"

- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
