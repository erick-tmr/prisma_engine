---
timezone: America/Sao_Paulo

manage_swap: true
swap_file: /swapfile
swap_size: 4G

pg_version: 17
pg_cluster: main
pg_conf_dir: "/etc/postgresql/{{ pg_version }}/{{ pg_cluster }}"

pg_app_role: prisma_engine
pg_app_databases:
  - prisma_engine_production
  - prisma_engine_production_cache
  - prisma_engine_production_queue
  - prisma_engine_production_cable
pg_hba_app_cidr: 172.16.0.0/12

pg_tuning:
  listen_addresses: "'*'"
  password_encryption: scram-sha-256
  shared_buffers: 1GB
  effective_cache_size: 3GB
  maintenance_work_mem: 256MB
  work_mem: 16MB
  max_connections: 50
  wal_compression: "on"

ufw_allowed_ports:
  - 22
  - 80
  - 443
ufw_postgres_port: 5432
ufw_postgres_cidr: 172.16.0.0/12

backup_bucket: "{{ lookup('ansible.builtin.env', 'BACKUP_BUCKET') | default('prisma-engine-backups', true) }}"
hc_ping_url: "{{ lookup('ansible.builtin.env', 'HC_PING_URL') | default('', true) }}"

db_password: "{{ lookup('ansible.builtin.env', 'PRISMA_ENGINE_DATABASE_PASSWORD') }}"
r2_access_key_id: "{{ lookup('ansible.builtin.env', 'R2_ACCESS_KEY_ID') }}"
r2_secret_access_key: "{{ lookup('ansible.builtin.env', 'R2_SECRET_ACCESS_KEY') }}"
r2_endpoint: "{{ lookup('ansible.builtin.env', 'R2_ENDPOINT') }}"

cloudflare_ipv4_ranges:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
cloudflare_ipv6_ranges:
