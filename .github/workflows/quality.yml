name: Quality

# Diff-aware quality gates + rich PR summaries. The blocking pass/fail contract
# lives in ci.yml; this workflow adds changed-line coverage, code-smell signal,
# security visibility (Brakeman/Semgrep SARIF), secret + dependency scanning, and
# one consolidated sticky PR comment. Coverage/code-smell/report jobs are
# PR-scoped (diff concerns); SARIF + secret jobs also run on main to seed the
# default-branch baseline.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (changed lines)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      # cmake/pkg-config build the rugged (libgit2) native ext that undercover needs.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips cmake pkg-config

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # undercover diffs changed lines against origin/main

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests to produce coverage
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare test

      - name: Coverage of changed lines (undercover)
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          bundle exec undercover --compare origin/main | tee undercover-report.txt

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          LINE=$(jq -r '.result.line' coverage/.last_run.json 2>/dev/null || echo "?")
          BRANCH=$(jq -r '.result.branch' coverage/.last_run.json 2>/dev/null || echo "?")
          {
            echo "## Coverage"
            echo "- Total line coverage: **${LINE}%**"
            echo "- Total branch coverage: **${BRANCH}%**"
            echo ""
            echo "### Changed lines (undercover)"
            echo '```'
            cat undercover-report.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            undercover-report.txt
          include-hidden-files: true   # keep .last_run.json (total %) for the report job
          if-no-files-found: warn

  code_quality:
    name: Code smells (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Reek on changed Ruby files (advisory)
        continue-on-error: true
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'app/**/*.rb' 'lib/**/*.rb' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "No changed Ruby files." | tee reek-report.txt
          else
            echo "Reek on: $CHANGED"
            bundle exec reek --force-exclusion $CHANGED | tee reek-report.txt || true
          fi

      - name: Code-smell summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Code smells — reek (changed files)"
            echo '```'
            cat reek-report.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reek report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reek-report
          path: reek-report.txt
          if-no-files-found: warn

  brakeman_sarif:
    name: Brakeman (code scanning)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The blocking Brakeman run lives in ci.yml; this run only surfaces findings
      # as PR annotations + the Security tab, so it must not fail the job.
      - name: Brakeman SARIF
        run: bin/brakeman -f sarif -o brakeman.sarif.json --no-pager || true

      - name: Upload Brakeman SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: brakeman.sarif.json
          category: brakeman

  semgrep_diff:
    name: Semgrep (new findings)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pipx install semgrep

      # On PRs, --baseline-commit reports/fails only on NEWLY introduced findings.
      # On main, a full scan seeds the default-branch baseline (non-blocking there).
      - name: Semgrep scan
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          COMMON="--config p/ruby --config p/security-audit --sarif --output semgrep.sarif --metrics off"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base origin/main HEAD)
            semgrep scan $COMMON --baseline-commit "$BASE" --error
          else
            semgrep scan $COMMON
          fi

      - name: Upload Semgrep SARIF
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # scan the full commit range, not just the tip

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required by the action to scan PRs
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE is only needed for organization-owned repos.

  dependency_review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: false   # we don't enforce a license policy; skip the unknown-license noise
          comment-summary-in-pr: on-failure

  report:
    name: PR quality report
    runs-on: ubuntu-latest
    # always() so the comment still posts (with the uncovered lines) when the
    # blocking coverage gate fails.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [ coverage, code_quality ]
    permissions:
      contents: read
      pull-requests: write   # required for the sticky comment
    steps:
      - name: Download reports
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble comment
        run: |
          LR=artifacts/coverage/coverage/.last_run.json
          LINE=$(jq -r '.result.line' "$LR" 2>/dev/null || echo "?")
          BRANCH=$(jq -r '.result.branch' "$LR" 2>/dev/null || echo "?")
          {
            echo "## CI quality summary"
            echo ""
            echo "### Coverage"
            echo "- Total line coverage: **${LINE}%**"
            echo "- Total branch coverage: **${BRANCH}%**"
            echo ""
            echo "Changed lines (undercover):"
            echo '```'
            cat artifacts/coverage/undercover-report.txt 2>/dev/null || echo "n/a"
            echo '```'
            echo "### Code smells — reek (changed files)"
            echo '```'
            cat artifacts/reek-report/reek-report.txt 2>/dev/null || echo "none"
            echo '```'
            echo "_Security findings (Brakeman, Semgrep) appear as PR annotations and under **Security ▸ Code scanning**. Secret-scan and dependency-review report inline on failure._"
          } > comment.md

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-quality
          path: comment.md
