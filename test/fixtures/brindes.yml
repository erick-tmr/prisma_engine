# Brindes load without attached images; the image-presence validation is exercised
# by building new records in test/models/brinde_test.rb. Integration tests that need
# a real attachment call `image.attach(io: ...)` in setUp.
current_brinde_poster:
  game_of_the_month: current_month
  caption: Poster Pokémon exclusivo
  position: 0

current_brinde_sticker:
  game_of_the_month: current_month
  caption: Cartela de stickers
  position: 1
