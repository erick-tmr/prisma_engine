# Local, on-demand log-analysis stack. Rehydrates the Docker json-file logs pulled
# by deploy/fetch-production-logs.sh into Loki, queried via Grafana Explore. Nothing
# here runs in production. Runbook: docs/log-analysis.md.
name: prisma-log-analysis

services:
  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  promtail:
    image: grafana/promtail:3.5.1
    command: ["-config.file=/etc/promtail/config.yaml"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ${PRODUCTION_LOG_DIR:-/tmp/prisma-production-logs}:/var/log/production:ro
      - promtail_positions:/var/promtail

  grafana:
    image: grafana/grafana:11.6.1
    ports: ["127.0.0.1:4000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  loki_data:
  promtail_positions:
